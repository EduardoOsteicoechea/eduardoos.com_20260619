# Eduardo OS — Edge only (nginx + certbot).
# Static site: build on host → frontend/dist (see deploy/ec2/build-frontend.sh).
# Backend: go run ./cmd/eduardoos on the host (:3000).

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  certbot_www:
