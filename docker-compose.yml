# Eduardo OS — Edge only (nginx + certbot).
# Static site: eduardoos-next/frontend/dist (production HTML root after cutover).
# Backend: eduardoos-next on the host (:3000 via systemd eduardoos.service).
# Staging :8080 mounts the same Next dist at /usr/share/nginx/eduardoos-next.
# Rollback: remount ./frontend/dist → html and restart bin/eduardoos.prev.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/eduardoos-next-staging.conf:/etc/nginx/conf.d/eduardoos-next-staging.conf:ro
      - ./eduardoos-next/frontend/dist:/usr/share/nginx/html:ro
      - ./eduardoos-next/frontend/dist:/usr/share/nginx/eduardoos-next:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  certbot_www:
