# HTTP → HTTPS redirect and ACME challenge
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS entry — Eduardo OS Next static site + API (:3000 on host)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/localhost/privkey.pem;

    client_max_body_size 128M;

    root /usr/share/nginx/html;
    index index.html;

    # Homescool student workspace pretty URL → static shell.
    location ~ ^/homescool/students/(?!workspace/?$)([^/]+)/?$ {
        rewrite ^ /homescool/students/workspace/index.html last;
    }

    # Greek group builder pretty URL → static shell.
    location ~ ^/greek/build/(?!workspace/?$)([^/]+)/?$ {
        rewrite ^ /greek/build/workspace/index.html last;
    }

    # Astro multi-page static + soft fallback.
    # Prefer $uri/index.html over bare $uri/ — an empty directory match on
    # $uri/ causes an internal redirect cycle and nginx 500 (seen on
    # /admin/users when dist was mid-rebuild or missing index.html).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Health — Next backend on the Docker host (port 3000)
    location /health {
        proxy_pass http://host.docker.internal:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API gateway — Eduardo OS Next on the Docker host (port 3000)
    # Preserve client X-Correlation-ID when present (same as staging).
    location /api/logger/stream {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }
}
