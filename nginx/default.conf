# HTTP → HTTPS redirect and ACME challenge
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS entry — Eduardo OS Next static site + API (:3000 on host)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/localhost/privkey.pem;

    client_max_body_size 128M;

    root /usr/share/nginx/html;
    index index.html;

    # Homescool student workspace pretty URL → static shell.
    location ~ ^/homescool/students/(?!workspace/?$)([^/]+)/?$ {
        rewrite ^ /homescool/students/workspace/index.html last;
    }

    # Church pretty URL /church/{denom}/{id} → static workspace shell.
    # Use try_files (not rewrite) so a missing index never loops into nginx 500.
    location ~ ^/church/(?!register/?$|overview/?$|activity/?$|workspace/?$|groups/?$|leaders/?$)([^/]+)/([^/]+)/?$ {
        try_files /church/workspace/index.html /church/workspace.html /index.html;
    }

    # Scrib pretty URL /scrib/{user}/{book}/{sheet} → static sheet shell.
    # rewrite (not try_files…/index.html) so a missing shell never serves home.
    location ~ ^/scrib/(?!sheet/?$)([^/]+)/([^/]+)/([^/]+)/?$ {
        rewrite ^ /scrib/sheet/index.html last;
    }

    # Static Issue Tracker for the eReport editor iframe.
    # Lives at /ereport-tracker.html so pretty /ereport/<user>/… rewrites cannot
    # loop it into nginx 500. Keep = /ereport/tracker.html as a compatibility alias.
    location = /ereport-tracker.html {
        try_files /ereport-tracker.html =404;
    }
    location = /ereport/tracker.html {
        try_files /ereport-tracker.html /ereport/tracker.html =404;
    }

    # eReport editor /ereport/{user}/{reportId}
    # Exclude hub/ and workspace/ prefixes so /ereport/hub/index.html does not
    # re-match and loop (nginx 500).
    location ~ ^/ereport/(?!hub(?:/|$)|workspace(?:/|$))([^/]+)/([^/]+)/?$ {
        rewrite ^ /ereport/workspace/index.html last;
    }

    # eReport hub /ereport/{user}
    location ~ ^/ereport/(?!hub(?:/|$)|workspace(?:/|$)|tracker\.html$)([^/]+)/?$ {
        rewrite ^ /ereport/hub/index.html last;
    }

    # Astro multi-page static + soft fallback.
    # Prefer $uri/index.html over bare $uri/ — an empty directory match on
    # $uri/ causes an internal redirect cycle and nginx 500 (seen on
    # /admin/users when dist was mid-rebuild or missing index.html).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Health — Next backend on the Docker host (port 3000)
    location /health {
        proxy_pass http://host.docker.internal:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API gateway — Eduardo OS Next on the Docker host (port 3000)
    # Preserve client X-Correlation-ID when present.
    location /api/logger/stream {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Agent Sandbox SSE ask — must not buffer; DeepSeek streams can run minutes.
    location ~ ^/api/admin/agent-sandbox/chats/[^/]+/ask$ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # APS webhook admin SSE monitor — live fan-out of ingested events.
    # Match logger stream: disable chunked rewrite; long read timeout for idle heartbeats.
    location = /api/admin/aps/webhook-events/stream {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # MPS meeting probes — allow slow APS upstream; must exceed PROBE_TIMEOUT_MS (default 25s).
    # Clients should receive structured JSON from the probe wrapper, not opaque nginx 504 HTML.
    location ^~ /api/admin/aps/probes {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
    }
}