# Eduardo OS Next STAGING — HTTP only on :8080.
# Mounted alongside default.conf (never replaces it).
# Docker paths: static root + proxy to host Next API on :3001.
server {
    listen 8080;
    server_name _;

    client_max_body_size 128M;

    root /usr/share/nginx/eduardoos-next;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /health {
        proxy_pass http://host.docker.internal:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # web-ifc WASM for OpenBIM /bim viewer (browsers need application/wasm).
    location /web-ifc/ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # Homescool student workspace pretty URL → static shell.
    # Keeps /homescool/students/{slug} in the browser; React reads the slug.
    location ~ ^/homescool/students/(?!workspace/?$)([^/]+)/?$ {
        rewrite ^ /homescool/students/workspace/index.html last;
    }

    # Greek group builder pretty URL → static shell.
    # Keeps /greek/build/{grupo} in the browser; React reads the slug.
    location ~ ^/greek/build/(?!workspace/?$)([^/]+)/?$ {
        rewrite ^ /greek/build/workspace/index.html last;
    }

    # Church detail pretty URL → static shell.
    # Keeps /church/{denom}/{churchId}; excludes register|overview|activity|workspace.
    location ~ ^/church/(?!register/?$|overview/?$|activity/?$|workspace/?$)([^/]+)/([^/]+)/?$ {
        rewrite ^ /church/workspace/index.html last;
    }

    # Prefer $uri/index.html over $uri/ to avoid empty-dir redirect → 500.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}