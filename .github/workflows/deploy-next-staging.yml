name: Deploy Eduardo OS Next (staging)

# Secondary stack only — never uses concurrency group deploy-ec2.
on:
  push:
    branches: [master]
    paths:
      - "eduardoos-next/**"
      - ".github/workflows/deploy-next-staging.yml"
  workflow_dispatch:

jobs:
  deploy-next-staging:
    name: Deploy Next staging to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-next-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY JWT_SECRET INTERNAL_SERVICE_SECRET SMTP_USER SMTP_PASS DOMAIN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Keepalives must be short: ServerAliveCountMax=120 × 30s could leave a half-closed
          # SSH session alive for up to an hour after the remote command already finished.
          # -n / BatchMode are applied per-invocation so stdin never keeps the channel open.
          {
            echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=4"
          } >> "$GITHUB_ENV"

      - name: Build Next staging .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          PAYPAL_HOSTED_BUTTON_ID: ${{ secrets.PAYPAL_HOSTED_BUTTON_ID != '' && secrets.PAYPAL_HOSTED_BUTTON_ID || 'QEVGD66SG7LXN' }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          PAYPAL_CHECKOUT_URL: ${{ secrets.PAYPAL_CHECKOUT_URL != '' && secrets.PAYPAL_CHECKOUT_URL || 'https://www.paypal.com/cgi-bin/webscr' }}
          PAYPAL_IPN_VERIFY_URL: ${{ secrets.PAYPAL_IPN_VERIFY_URL != '' && secrets.PAYPAL_IPN_VERIFY_URL || 'https://ipnpb.paypal.com/cgi-bin/webscr' }}
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_ACTIVITY_ID: ${{ secrets.APS_ACTIVITY_ID }}
        run: |
          # systemd EnvironmentFile-safe quoting: wrap in double quotes and escape
          # \, ", and `. Strip spaces from SMTP_PASS (Gmail app passwords are 16
          # chars; UI spaces break smtp.gmail.com auth if left in).
          quote_env() {
            local val="${1-}"
            val="${val//\\/\\\\}"
            val="${val//\"/\\\"}"
            val="${val//\`/\\\`}"
            printf '"%s"' "$val"
          }
          SMTP_PASS_NORM="$(printf '%s' "$SMTP_PASS" | tr -d '[:space:]')"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\'}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\'}"
          if [ "${#SMTP_PASS_NORM}" -ne 16 ]; then
            echo "::error::SMTP_PASS must be a 16-char Gmail App Password after stripping spaces (got length ${#SMTP_PASS_NORM}). Secret name must be exactly SMTP_PASS."
            exit 1
          fi
          if ! printf '%s' "$SMTP_USER" | grep -q '@'; then
            echo "::error::SMTP_USER must be the Gmail address that owns the App Password."
            exit 1
          fi
          {
            printf 'ADDR=:3001\n'
            printf 'JWT_SECRET=%s\n' "$(quote_env "$JWT_SECRET")"
            printf 'INTERNAL_SERVICE_SECRET=%s\n' "$(quote_env "$INTERNAL_SERVICE_SECRET")"
            printf 'SMTP_USER=%s\n' "$(quote_env "$SMTP_USER")"
            printf 'SMTP_PASS=%s\n' "$(quote_env "$SMTP_PASS_NORM")"
            printf 'DOMAIN=%s\n' "$(quote_env "$DOMAIN")"
            printf 'DEV_RETURN_OTP=0\n'
            printf 'AWS_REGION=us-east-1\n'
            printf 'S3_BACKEND=aws\n'
            printf 'S3_BUCKET=eduardoos20260607\n'
            printf 'IFCBIM_S3_BUCKET=eduardoos20260607\n'
            printf 'DATABASE_BACKEND=dynamodb\n'
            printf 'DYNAMODB_TABLE_PREFIX=eduardoos\n'
            printf 'EPAMS_BACKEND=dynamodb\n'
            printf 'EPAMS_TABLE=eduardoos_epams\n'
            printf 'IFCBIM_BACKEND=dynamodb\n'
            printf 'IFCBIM_TABLE=eduardoos_ifcbim\n'
            printf 'PAYPAL_HOSTED_BUTTON_ID=%s\n' "$(quote_env "$PAYPAL_HOSTED_BUTTON_ID")"
            printf 'PAYPAL_BUSINESS_EMAIL=%s\n' "$(quote_env "${PAYPAL_BUSINESS_EMAIL:-}")"
            printf 'PAYPAL_CHECKOUT_URL=%s\n' "$(quote_env "$PAYPAL_CHECKOUT_URL")"
            printf 'PAYPAL_IPN_VERIFY_URL=%s\n' "$(quote_env "$PAYPAL_IPN_VERIFY_URL")"
            printf 'APS_CLIENT_ID=%s\n' "$(quote_env "${APS_CLIENT_ID:-}")"
            printf 'APS_CLIENT_SECRET=%s\n' "$(quote_env "${APS_CLIENT_SECRET:-}")"
            printf 'APS_ACTIVITY_ID=%s\n' "$(quote_env "${APS_ACTIVITY_ID:-}")"
            printf 'APS_S3_BUCKET=aps20250806\n'
            printf 'APS_S3_REGION=us-east-1\n'
          } > .env.next-staging
          # Metadata-only sanity (never print secret values).
          echo "SMTP_USER set; SMTP_PASS normalized length=${#SMTP_PASS_NORM} (spaces/quotes stripped for Gmail)"

      - name: Prepare EC2 paths
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p ~/eduardoos.com_20260619/eduardoos-next/deploy"

      - name: Upload .env and staging deploy script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            .env.next-staging \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/eduardoos-next/.env"
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            eduardoos-next/deploy/deploy-remote-staging.sh \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/eduardoos-next/deploy/deploy-remote-staging.sh"

      - name: Run remote staging deploy
        timeout-minutes: 20
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # -n: do not read stdin (prevents SSH from hanging the step after remote exits).
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "flock -w 1500 /tmp/eduardoos-ec2-deploy.lock bash -lc 'cd ~/eduardoos.com_20260619 && git fetch origin master && git reset --hard origin/master && chmod +x eduardoos-next/deploy/*.sh && APP_DIR=~/eduardoos.com_20260619 bash eduardoos-next/deploy/deploy-remote-staging.sh'"

      - name: Smoke check staging (on-box + public)
        timeout-minutes: 2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          sleep 3
          # Bound the whole remote probe; -n closes stdin; remote curls use --max-time so nothing waits forever.
          onbox=$(timeout 45 ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "api=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:3001/health || printf 000); \
             hl=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:8080/health || printf 000); \
             web=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:8080/ || printf 000); \
             printf 'api=%s health=%s web=%s\n' \"\$api\" \"\$hl\" \"\$web\"; exit 0")
          echo "On-box smoke: ${onbox}"
          echo "${onbox}" | grep -q 'api=200' || { echo "::error::Next backend :3001 unhealthy"; exit 1; }
          echo "${onbox}" | grep -q 'health=200' || { echo "::error::Staging nginx :8080 /health failed"; exit 1; }
          base="http://${EC2_HOST}:8080"
          pub=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "${base}/health" || printf '000')
          home=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "${base}/" || printf '000')
          echo "Public smoke ${base}/health => ${pub}"
          echo "Public smoke ${base}/ => ${home}"
          if [ "${pub}" != "200" ]; then
            echo "::warning::Public :8080 unreachable (got ${pub}). On-box smoke passed - open AWS Security Group inbound TCP 8080 to browse ${base}/ from the internet."
          else
            echo "Staging public OK: ${base}/"
          fi
          # Force a clean step exit so a leftover SSH/curl FD cannot keep the job yellow forever.
          exit 0
