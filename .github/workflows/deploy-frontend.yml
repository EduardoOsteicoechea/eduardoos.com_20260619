name: CI/CD — Frontend fast deploy

# Frontend-only changes: build check in CI, then rebuild static assets on EC2
# without backend/Docker rebuilds.
#
# Mixed commits (frontend + backend) also match `paths:` below, but must NOT
# take the shared EC2 lock — that cancelled the full deploy and skipped both
# remotes. A gate job decides; only frontend-only pushes run the EC2 deploy job.

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "deploy/ec2/build-frontend.sh"
      - "deploy/ec2/deploy-frontend-remote.sh"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # No deploy-ec2 concurrency here — mixed pushes must leave the lock free for deploy.yml.
  gate:
    name: Frontend-only gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether this push should touch EC2
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — frontend fast deploy owns EC2."
            exit 0
          fi
          # Same allowlist as paths: + markdown; anything else ⇒ full deploy.yml owns EC2.
          if git diff --name-only HEAD~1 HEAD | grep -Ev '^(frontend/|deploy/ec2/build-frontend\.sh|deploy/ec2/deploy-frontend-remote\.sh|\.github/workflows/deploy-frontend\.yml|.*\.md$)' | grep -q .; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Non-frontend paths changed — skipping EC2; full deploy workflow owns the host."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Frontend-only push — fast deploy may update EC2."
          fi

  deploy:
    name: Deploy frontend to EC2
    needs: [build, gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.gate.outputs.deploy == 'true'
    # Only the job that SSHs to EC2 shares the lock with deploy.yml.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=60" >> "$GITHUB_ENV"

      - name: Upload frontend deploy script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            deploy/ec2/deploy-frontend-remote.sh \
            deploy/ec2/build-frontend.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Run frontend-only remote deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "cd ~/eduardoos.com_20260619 && cp /tmp/deploy-frontend-remote.sh /tmp/build-frontend.sh deploy/ec2/ && chmod +x deploy/ec2/*.sh && APP_DIR=~/eduardoos.com_20260619 bash deploy/ec2/deploy-frontend-remote.sh"
