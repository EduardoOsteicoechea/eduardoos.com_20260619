name: CI/CD — Deploy to EC2

on:
  push:
    branches: [master]
    # Frontend-only pushes use deploy-frontend.yml (faster). Mixed/backend pushes still hit this job.
    paths-ignore:
      - "frontend/**"
      - "deploy/ec2/build-frontend.sh"
      - "deploy/ec2/deploy-frontend-remote.sh"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/frontend.yml"
      - "**.md"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 (arm64)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Job-level lock shared with frontend fast deploy (only when that job actually SSHs).
    concurrency:
      group: deploy-ec2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY JWT_SECRET INTERNAL_SERVICE_SECRET SMTP_USER SMTP_PASS DOMAIN CERTBOT_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          if echo "${DOMAIN:-}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::DOMAIN must be your hostname (e.g. eduardoos.com), not an IP. Use EC2_HOST for the server IP."
            missing=1
          fi
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120" >> "$GITHUB_ENV"

      - name: Build production .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          PAYPAL_HOSTED_BUTTON_ID: ${{ secrets.PAYPAL_HOSTED_BUTTON_ID != '' && secrets.PAYPAL_HOSTED_BUTTON_ID || 'QEVGD66SG7LXN' }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          PAYPAL_CHECKOUT_URL: ${{ secrets.PAYPAL_CHECKOUT_URL != '' && secrets.PAYPAL_CHECKOUT_URL || 'https://www.paypal.com/cgi-bin/webscr' }}
          PAYPAL_IPN_VERIFY_URL: ${{ secrets.PAYPAL_IPN_VERIFY_URL != '' && secrets.PAYPAL_IPN_VERIFY_URL || 'https://ipnpb.paypal.com/cgi-bin/webscr' }}
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_ACTIVITY_ID: ${{ secrets.APS_ACTIVITY_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'INTERNAL_SERVICE_SECRET=%s\n' "$INTERNAL_SERVICE_SECRET"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'CERTBOT_EMAIL=%s\n' "$CERTBOT_EMAIL"
            printf 'PAYPAL_HOSTED_BUTTON_ID=%s\n' "$PAYPAL_HOSTED_BUTTON_ID"
            printf 'PAYPAL_BUSINESS_EMAIL=%s\n' "$PAYPAL_BUSINESS_EMAIL"
            printf 'PAYPAL_CHECKOUT_URL=%s\n' "$PAYPAL_CHECKOUT_URL"
            printf 'PAYPAL_IPN_VERIFY_URL=%s\n' "$PAYPAL_IPN_VERIFY_URL"
            printf 'AWS_REGION=us-east-1\n'
            printf 'S3_BUCKET=eduardoos20260607\n'
            printf 'S3_PREFIX=media\n'
            printf 'S3_BACKEND=aws\n'
            printf 'DATABASE_BACKEND=dynamodb\n'
            printf 'DYNAMODB_TABLE_PREFIX=eduardoos\n'
            printf 'TELEMETRY_BACKEND=dynamodb\n'
            printf 'TESTER_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_TABLE=eduardoos_playlists\n'
            printf 'EPAMS_BACKEND=dynamodb\n'
            printf 'EPAMS_TABLE=eduardoos_epams\n'
            printf 'EDEBATS_BACKEND=dynamodb\n'
            printf 'EDEBATS_TABLE=eduardoos_edebats\n'
            printf 'PAYMENTS_BACKEND=dynamodb\n'
            printf 'PAYMENTS_TABLE=eduardoos_payments\n'
            printf 'ENTITLEMENTS_BACKEND=dynamodb\n'
            printf 'ENTITLEMENTS_TABLE=eduardoos_entitlements\n'
            printf 'IFCBIM_BACKEND=dynamodb\n'
            printf 'IFCBIM_TABLE=eduardoos_ifcbim\n'
            printf 'S3_AUDIO_PREFIX=worship_playlists\n'
            printf 'APS_S3_BUCKET=aps20250806\n'
            printf 'APS_S3_REGION=us-east-1\n'
            printf 'APS_OUTPUT_ARGUMENT=outputFile\n'
            printf 'APS_INPUT_ARGUMENT=inputFile\n'
            printf 'APS_INPUT_OBJECT_KEY=singleRoom.rvt\n'
            printf 'APS_OUTPUT_FILE_NAME=result.json\n'
            printf 'APS_OUTPUT_KEY_PREFIX=aps-outputs\n'
            printf 'APS_CLIENT_ID=%s\n' "${APS_CLIENT_ID:-}"
            printf 'APS_CLIENT_SECRET=%s\n' "${APS_CLIENT_SECRET:-}"
            printf 'APS_ACTIVITY_ID=%s\n' "${APS_ACTIVITY_ID:-}"
            printf 'DEEPSEEK_API_KEY=%s\n' "${DEEPSEEK_API_KEY:-}"
            printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com\n'
            printf 'DEEPSEEK_MODEL_EXPERT=deepseek-v4-flash\n'
            printf 'DEEPSEEK_MODEL_REFREE=deepseek-v4-pro\n'
          } > .env.production

      - name: Prepare EC2 app directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p ~/eduardoos.com_20260619"

      - name: Upload .env and deploy script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            .env.production \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/.env"
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            deploy/ec2/deploy-remote.sh \
            deploy/ec2/build-frontend.sh \
            deploy/ec2/issue-cert.sh \
            deploy/aws/create-observability-tables.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Run remote deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "cd ~/eduardoos.com_20260619 && git fetch origin master && git reset --hard origin/master && chmod +x deploy/ec2/*.sh deploy/aws/*.sh 2>/dev/null || true && APP_DIR=~/eduardoos.com_20260619 bash deploy/ec2/deploy-remote.sh"

      - name: Smoke check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/" || true)
          echo "HTTPS status for https://${DOMAIN}/: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::warning::HTTPS smoke check did not return 200 (cert may still be self-signed)"
          fi
