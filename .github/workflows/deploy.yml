name: CI/CD — Deploy to EC2

# One push to master → one deploy job on EC2 (Eduardo OS Next production + nginx).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-ec2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY JWT_SECRET INTERNAL_SERVICE_SECRET SMTP_USER SMTP_PASS DOMAIN CERTBOT_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          if echo "${DOMAIN:-}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::DOMAIN must be your hostname (e.g. eduardoos.com), not an IP. Use EC2_HOST for the server IP."
            missing=1
          fi
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120" >> "$GITHUB_ENV"

      - name: Build production .env (Eduardo OS Next)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          PAYPAL_HOSTED_BUTTON_ID: ${{ secrets.PAYPAL_HOSTED_BUTTON_ID != '' && secrets.PAYPAL_HOSTED_BUTTON_ID || 'QEVGD66SG7LXN' }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          PAYPAL_CHECKOUT_URL: ${{ secrets.PAYPAL_CHECKOUT_URL != '' && secrets.PAYPAL_CHECKOUT_URL || 'https://www.paypal.com/cgi-bin/webscr' }}
          PAYPAL_IPN_VERIFY_URL: ${{ secrets.PAYPAL_IPN_VERIFY_URL != '' && secrets.PAYPAL_IPN_VERIFY_URL || 'https://ipnpb.paypal.com/cgi-bin/webscr' }}
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_ACTIVITY_ID: ${{ secrets.APS_ACTIVITY_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # systemd EnvironmentFile-safe quoting (same as staging). Strip spaces from
          # SMTP_PASS so Gmail app passwords with UI spaces still authenticate.
          quote_env() {
            local val="${1-}"
            val="${val//\\/\\\\}"
            val="${val//\"/\\\"}"
            val="${val//\`/\\\`}"
            printf '"%s"' "$val"
          }
          SMTP_PASS_NORM="$(printf '%s' "$SMTP_PASS" | tr -d '[:space:]')"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\'}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\'}"
          if [ "${#SMTP_PASS_NORM}" -ne 16 ]; then
            echo "::error::SMTP_PASS must be a 16-char Gmail App Password after stripping spaces (got length ${#SMTP_PASS_NORM}). Secret name must be exactly SMTP_PASS — updating alone does nothing until this workflow redeploys."
            exit 1
          fi
          if ! printf '%s' "$SMTP_USER" | grep -q '@'; then
            echo "::error::SMTP_USER must be the Gmail address that owns the App Password (expected eduardooost@gmail.com)."
            exit 1
          fi
          {
            printf 'ADDR=:3000\n'
            printf 'JWT_SECRET=%s\n' "$(quote_env "$JWT_SECRET")"
            printf 'INTERNAL_SERVICE_SECRET=%s\n' "$(quote_env "$INTERNAL_SERVICE_SECRET")"
            printf 'SMTP_USER=%s\n' "$(quote_env "$SMTP_USER")"
            printf 'SMTP_PASS=%s\n' "$(quote_env "$SMTP_PASS_NORM")"
            printf 'DOMAIN=%s\n' "$(quote_env "$DOMAIN")"
            printf 'CERTBOT_EMAIL=%s\n' "$(quote_env "$CERTBOT_EMAIL")"
            printf 'DEV_RETURN_OTP=0\n'
            printf 'AWS_REGION=us-east-1\n'
            printf 'S3_BUCKET=eduardoos20260607\n'
            printf 'S3_PREFIX=media\n'
            printf 'S3_BACKEND=aws\n'
            printf 'IFCBIM_S3_BUCKET=eduardoos20260607\n'
            printf 'DATABASE_BACKEND=dynamodb\n'
            printf 'DYNAMODB_TABLE_PREFIX=eduardoos\n'
            printf 'TELEMETRY_BACKEND=dynamodb\n'
            printf 'TESTER_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_TABLE=eduardoos_playlists\n'
            printf 'EPAMS_BACKEND=dynamodb\n'
            printf 'EPAMS_TABLE=eduardoos_epams\n'
            printf 'EDEBATS_BACKEND=dynamodb\n'
            printf 'EDEBATS_TABLE=eduardoos_edebats\n'
            printf 'PAYMENTS_BACKEND=dynamodb\n'
            printf 'PAYMENTS_TABLE=eduardoos_payments\n'
            printf 'ENTITLEMENTS_BACKEND=dynamodb\n'
            printf 'ENTITLEMENTS_TABLE=eduardoos_entitlements\n'
            printf 'IFCBIM_BACKEND=dynamodb\n'
            printf 'IFCBIM_TABLE=eduardoos_ifcbim\n'
            printf 'S3_AUDIO_PREFIX=worship_playlists\n'
            printf 'APS_S3_BUCKET=aps20250806\n'
            printf 'APS_S3_REGION=us-east-1\n'
            printf 'APS_OUTPUT_ARGUMENT=outputFile\n'
            printf 'APS_INPUT_ARGUMENT=inputFile\n'
            printf 'APS_INPUT_OBJECT_KEY=singleRoom.rvt\n'
            printf 'APS_OUTPUT_FILE_NAME=result.json\n'
            printf 'APS_OUTPUT_KEY_PREFIX=aps-outputs\n'
            printf 'APS_CLIENT_ID=%s\n' "$(quote_env "${APS_CLIENT_ID:-}")"
            printf 'APS_CLIENT_SECRET=%s\n' "$(quote_env "${APS_CLIENT_SECRET:-}")"
            printf 'APS_ACTIVITY_ID=%s\n' "$(quote_env "${APS_ACTIVITY_ID:-}")"
            printf 'PAYPAL_HOSTED_BUTTON_ID=%s\n' "$(quote_env "$PAYPAL_HOSTED_BUTTON_ID")"
            printf 'PAYPAL_BUSINESS_EMAIL=%s\n' "$(quote_env "${PAYPAL_BUSINESS_EMAIL:-}")"
            printf 'PAYPAL_CHECKOUT_URL=%s\n' "$(quote_env "$PAYPAL_CHECKOUT_URL")"
            printf 'PAYPAL_IPN_VERIFY_URL=%s\n' "$(quote_env "$PAYPAL_IPN_VERIFY_URL")"
            printf 'DEEPSEEK_API_KEY=%s\n' "$(quote_env "${DEEPSEEK_API_KEY:-}")"
            printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com\n'
            printf 'DEEPSEEK_MODEL_EXPERT=deepseek-v4-flash\n'
            printf 'DEEPSEEK_MODEL_REFREE=deepseek-v4-pro\n'
          } > .env.production
          echo "SMTP_USER set; SMTP_PASS normalized length=${#SMTP_PASS_NORM} (spaces/quotes stripped for Gmail)"
          echo "NOTE: Updating GitHub secrets alone does not restart EC2 — this job uploads .env and restarts eduardoos.service."

      - name: Prepare EC2 app directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p ~/eduardoos.com_20260619/eduardoos-next/deploy"

      - name: Upload .env and deploy scripts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Production env lives at APP_DIR/.env only. Do not overwrite
          # eduardoos-next/.env (staging ADDR=:3001) or staging binds :3000 and dies.
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            .env.production \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/.env"
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            deploy/ec2/deploy-remote.sh \
            deploy/ec2/build-frontend.sh \
            deploy/ec2/issue-cert.sh \
            deploy/aws/create-observability-tables.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/"
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            eduardoos-next/deploy/deploy-remote-production.sh \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/eduardoos-next/deploy/deploy-remote-production.sh"

      - name: Run remote deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "cd ~/eduardoos.com_20260619 && git fetch origin master && git reset --hard origin/master && chmod +x deploy/ec2/*.sh deploy/aws/*.sh eduardoos-next/deploy/*.sh 2>/dev/null || true && APP_DIR=~/eduardoos.com_20260619 bash deploy/ec2/deploy-remote.sh"

      - name: Smoke check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          sleep 15
          onbox=$(ssh -i ~/.ssh/deploy_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" \
            'api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health || true); \
             echo "api=${api}"')
          echo "On-box smoke: ${onbox}"
          echo "${onbox}" | grep -q 'api=200' || { echo "::error::Next production backend :3000 unhealthy"; exit 1; }

          # Confirm systemd loaded SMTP without printing secret values (length + flags only).
          smtp_smoke=$(ssh -i ~/.ssh/deploy_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" \
            'set -e
             ENV=~/eduardoos.com_20260619/.env
             line=$(grep -E "^SMTP_PASS=" "$ENV" | head -n1 | cut -d= -f2- | tr -d "\r" | sed "s/^\"//; s/\"$//; s/^'\''//; s/'\''$//" | tr -d "[:space:]")
             echo "env_smtp_pass_len=${#line}"
             journal=$(sudo journalctl -u eduardoos -b --no-pager -o cat 2>/dev/null | grep -E "smtp: user=" | tail -n1 || true)
             echo "startup_smtp_line=${journal}"
             ')
          echo "SMTP smoke (no secrets): ${smtp_smoke}"
          echo "${smtp_smoke}" | grep -q 'env_smtp_pass_len=16' || {
            echo "::error::Production .env SMTP_PASS length is not 16 after deploy — secret name must be SMTP_PASS and workflow must rebuild .env"
            exit 1
          }
          echo "${smtp_smoke}" | grep -q 'pass_set=true' || {
            echo "::error::eduardoos.service started without SMTP_PASS (pass_set!=true). Check EnvironmentFile=~/…/.env and restart."
            exit 1
          }
          echo "${smtp_smoke}" | grep -Eq 'pass_norm_len=16|pass_raw_len=16' || {
            echo "::warning::startup smtp line missing pass_*_len=16 — check journalctl -u eduardoos for smtp:"
          }

          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/" || true)
          health=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/health" || true)
          echo "HTTPS status for https://${DOMAIN}/: ${code}"
          echo "HTTPS status for https://${DOMAIN}/health: ${health}"
          if [ "${code}" != "200" ]; then
            echo "::warning::HTTPS home smoke did not return 200 (cert may still be self-signed)"
          fi
          if [ "${health}" != "200" ]; then
            echo "::warning::HTTPS /health smoke did not return 200"
          fi
