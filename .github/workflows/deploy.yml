name: CI/CD — Deploy to EC2

# One push to master → one production deploy on EC2 (selective by changed paths).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Build/restart Go backend
        type: boolean
        default: true
      deploy_frontend:
        description: Build Astro on runner and upload dist
        type: boolean
        default: true
      deploy_nginx:
        description: Re-render nginx + compose/certbot
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-ec2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy scopes
        id: scope
        run: |
          set -euo pipefail
          backend=0
          frontend=0
          nginx=0
          skip=0

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.deploy_backend }}" = "true" ] && backend=1
            [ "${{ inputs.deploy_frontend }}" = "true" ] && frontend=1
            [ "${{ inputs.deploy_nginx }}" = "true" ] && nginx=1
            echo "Manual dispatch scopes: backend=${backend} frontend=${frontend} nginx=${nginx}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable before SHA — full deploy"
              backend=1; frontend=1; nginx=1
            else
              mapfile -t files < <(git diff --name-only "${BEFORE}" "${AFTER}" || true)
              echo "Changed files (${#files[@]}):"
              printf '  %s\n' "${files[@]}" || true

              if [ "${#files[@]}" -eq 0 ]; then
                echo "Empty diff — full deploy for safety"
                backend=1; frontend=1; nginx=1
              else
                relevant=0
                for f in "${files[@]}"; do
                  case "${f}" in
                    backend/*)
                      backend=1; relevant=1 ;;
                    frontend/*)
                      frontend=1; relevant=1 ;;
                    nginx/*|docker-compose.yml|docker-compose.ec2.yml)
                      nginx=1; relevant=1 ;;
                    deploy/*|.github/workflows/deploy.yml)
                      # Infra / deploy scripts: rebuild everything that production serves.
                      backend=1; frontend=1; nginx=1; relevant=1 ;;
                    *)
                      ;;
                  esac
                done
                if [ "${relevant}" -eq 0 ]; then
                  echo "No production-scoped paths changed — skipping remote deploy"
                  skip=1
                fi
              fi
            fi
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "nginx=${nginx}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "Resolved scopes: backend=${backend} frontend=${frontend} nginx=${nginx} skip=${skip}"

      - name: Validate required secrets
        if: steps.scope.outputs.skip != '1'
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY JWT_SECRET INTERNAL_SERVICE_SECRET SMTP_USER SMTP_PASS DOMAIN CERTBOT_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          if echo "${DOMAIN:-}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::DOMAIN must be your hostname (e.g. eduardoos.com), not an IP. Use EC2_HOST for the server IP."
            missing=1
          fi
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}

      - name: Configure SSH
        if: steps.scope.outputs.skip != '1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=4" >> "$GITHUB_ENV"

      - name: Build production .env
        if: steps.scope.outputs.skip != '1'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          PAYPAL_HOSTED_BUTTON_ID: ${{ secrets.PAYPAL_HOSTED_BUTTON_ID != '' && secrets.PAYPAL_HOSTED_BUTTON_ID || 'QEVGD66SG7LXN' }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          PAYPAL_CHECKOUT_URL: ${{ secrets.PAYPAL_CHECKOUT_URL != '' && secrets.PAYPAL_CHECKOUT_URL || 'https://www.paypal.com/cgi-bin/webscr' }}
          PAYPAL_IPN_VERIFY_URL: ${{ secrets.PAYPAL_IPN_VERIFY_URL != '' && secrets.PAYPAL_IPN_VERIFY_URL || 'https://ipnpb.paypal.com/cgi-bin/webscr' }}
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_ACTIVITY_ID: ${{ secrets.APS_ACTIVITY_ID }}
          APS_OAUTH_SCOPE: ${{ secrets.APS_OAUTH_SCOPE }}
          APS_HUB_ID: ${{ secrets.APS_HUB_ID }}
          APS_PROJECT_ID: ${{ secrets.APS_PROJECT_ID }}
          APS_REGION: ${{ secrets.APS_REGION }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          quote_env() {
            local val="${1-}"
            val="${val//\\/\\\\}"
            val="${val//\"/\\\"}"
            val="${val//\`/\\\`}"
            printf '"%s"' "$val"
          }
          SMTP_PASS_NORM="$(printf '%s' "$SMTP_PASS" | tr -d '[:space:]')"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\"}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM%\'}"
          SMTP_PASS_NORM="${SMTP_PASS_NORM#\'}"
          if [ "${#SMTP_PASS_NORM}" -ne 16 ]; then
            echo "::error::SMTP_PASS must be a 16-char Gmail App Password after stripping spaces (got length ${#SMTP_PASS_NORM}). Secret name must be exactly SMTP_PASS — updating alone does nothing until this workflow redeploys."
            exit 1
          fi
          if ! printf '%s' "$SMTP_USER" | grep -q '@'; then
            echo "::error::SMTP_USER must be the Gmail address that owns the App Password (expected eduardooost@gmail.com)."
            exit 1
          fi
          {
            printf 'ADDR=:3000\n'
            printf 'JWT_SECRET=%s\n' "$(quote_env "$JWT_SECRET")"
            printf 'INTERNAL_SERVICE_SECRET=%s\n' "$(quote_env "$INTERNAL_SERVICE_SECRET")"
            printf 'SMTP_USER=%s\n' "$(quote_env "$SMTP_USER")"
            printf 'SMTP_PASS=%s\n' "$(quote_env "$SMTP_PASS_NORM")"
            printf 'DOMAIN=%s\n' "$(quote_env "$DOMAIN")"
            printf 'CERTBOT_EMAIL=%s\n' "$(quote_env "$CERTBOT_EMAIL")"
            printf 'DEV_RETURN_OTP=0\n'
            printf 'AWS_REGION=us-east-1\n'
            printf 'S3_BUCKET=eduardoos20260607\n'
            printf 'S3_PREFIX=media\n'
            printf 'S3_BACKEND=aws\n'
            printf 'IFCBIM_S3_BUCKET=eduardoos20260607\n'
            printf 'DATABASE_BACKEND=dynamodb\n'
            printf 'DYNAMODB_TABLE_PREFIX=eduardoos\n'
            printf 'TELEMETRY_BACKEND=dynamodb\n'
            printf 'TESTER_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_BACKEND=dynamodb\n'
            printf 'PLAYLISTS_TABLE=eduardoos_playlists\n'
            printf 'EPAMS_BACKEND=dynamodb\n'
            printf 'EPAMS_TABLE=eduardoos_epams\n'
            printf 'FOOTERS_TABLE=eduardoos_pamphlet_footer_profiles\n'
            printf 'EDEBATS_BACKEND=dynamodb\n'
            printf 'EDEBATS_TABLE=eduardoos_edebats\n'
            printf 'PAYMENTS_BACKEND=dynamodb\n'
            printf 'PAYMENTS_TABLE=eduardoos_payments\n'
            printf 'ENTITLEMENTS_BACKEND=dynamodb\n'
            printf 'ENTITLEMENTS_TABLE=eduardoos_entitlements\n'
            printf 'IFCBIM_BACKEND=dynamodb\n'
            printf 'IFCBIM_TABLE=eduardoos_ifcbim\n'
            printf 'S3_AUDIO_PREFIX=worship_playlists\n'
            printf 'APS_S3_BUCKET=aps20250806\n'
            printf 'APS_S3_REGION=us-east-1\n'
            printf 'APS_OUTPUT_ARGUMENT=outputFile\n'
            printf 'APS_INPUT_ARGUMENT=inputFile\n'
            printf 'APS_INPUT_OBJECT_KEY=singleRoom.rvt\n'
            printf 'APS_OUTPUT_FILE_NAME=result.json\n'
            printf 'APS_OUTPUT_KEY_PREFIX=aps-outputs\n'
            printf 'APS_CLIENT_ID=%s\n' "$(quote_env "${APS_CLIENT_ID:-}")"
            printf 'APS_CLIENT_SECRET=%s\n' "$(quote_env "${APS_CLIENT_SECRET:-}")"
            printf 'APS_ACTIVITY_ID=%s\n' "$(quote_env "${APS_ACTIVITY_ID:-}")"
            # Design Automation credentials (website MPS probes / webhook ingest retired — specs 030/031).
            printf 'APS_OAUTH_SCOPE=%s\n' "$(quote_env "${APS_OAUTH_SCOPE:-code:all data:read data:write account:read}")"
            printf 'APS_HUB_ID=%s\n' "$(quote_env "${APS_HUB_ID:-}")"
            printf 'APS_PROJECT_ID=%s\n' "$(quote_env "${APS_PROJECT_ID:-}")"
            printf 'APS_REGION=%s\n' "$(quote_env "${APS_REGION:-US}")"
            printf 'PAYPAL_HOSTED_BUTTON_ID=%s\n' "$(quote_env "$PAYPAL_HOSTED_BUTTON_ID")"
            printf 'PAYPAL_BUSINESS_EMAIL=%s\n' "$(quote_env "${PAYPAL_BUSINESS_EMAIL:-}")"
            printf 'PAYPAL_CHECKOUT_URL=%s\n' "$(quote_env "$PAYPAL_CHECKOUT_URL")"
            printf 'PAYPAL_IPN_VERIFY_URL=%s\n' "$(quote_env "$PAYPAL_IPN_VERIFY_URL")"
            printf 'DEEPSEEK_API_KEY=%s\n' "$(quote_env "${DEEPSEEK_API_KEY:-}")"
            printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com\n'
            printf 'DEEPSEEK_MODEL_EXPERT=deepseek-v4-flash\n'
            printf 'DEEPSEEK_MODEL_REFREE=deepseek-v4-pro\n'
            printf 'KIMI_API_KEY=%s\n' "$(quote_env "${KIMI_API_KEY:-}")"
            printf 'KIMI_BASE_URL=https://api.moonshot.ai/v1\n'
            printf 'KIMI_MODEL_REFEREE=kimi-k3\n'
            printf 'KIMI_MODEL_EXPERT=kimi-k3\n'
            printf 'KIMI_MODEL_CODER=kimi-k2.7-code\n'
          } > .env.production
          echo "SMTP_USER set; SMTP_PASS normalized length=${#SMTP_PASS_NORM} (spaces/quotes stripped for Gmail)"
          echo "NOTE: Updating GitHub secrets alone does not restart EC2 — this job uploads .env and restarts eduardoos.service."

      - name: Setup Node.js (frontend build)
        if: steps.scope.outputs.skip != '1' && steps.scope.outputs.frontend == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Astro frontend on runner
        if: steps.scope.outputs.skip != '1' && steps.scope.outputs.frontend == '1'
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          rm -rf dist-build
          npx astro build --outDir dist-build
          required_files=(
            "index.html"
            "admin/users/index.html"
            "payments/subscription/index.html"
            "contact/index.html"
            "church/workspace/index.html"
            "favicon.svg"
          )
          for rel in "${required_files[@]}"; do
            if [[ ! -f "dist-build/${rel}" ]]; then
              echo "::error::Missing required build output: dist-build/${rel}"
              exit 1
            fi
          done
          tar -C dist-build -czf "${GITHUB_WORKSPACE}/frontend-dist.tgz" .
          ls -lh "${GITHUB_WORKSPACE}/frontend-dist.tgz"

      - name: Prepare EC2 app directory
        if: steps.scope.outputs.skip != '1'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p ~/eduardoos.com_20260619/deploy/ec2 ~/eduardoos.com_20260619/deploy/aws"

      - name: Upload .env and deploy scripts
        if: steps.scope.outputs.skip != '1'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            .env.production \
            "${EC2_USER}@${EC2_HOST}:~/eduardoos.com_20260619/.env"
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            deploy/ec2/deploy-remote.sh \
            deploy/ec2/deploy-remote-production.sh \
            deploy/ec2/build-frontend.sh \
            deploy/ec2/publish-frontend-dist.sh \
            deploy/ec2/issue-cert.sh \
            deploy/aws/create-observability-tables.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/"
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p ~/eduardoos.com_20260619/deploy/ec2 && mv -f /tmp/deploy-remote.sh /tmp/deploy-remote-production.sh /tmp/build-frontend.sh /tmp/publish-frontend-dist.sh /tmp/issue-cert.sh ~/eduardoos.com_20260619/deploy/ec2/ && mv -f /tmp/create-observability-tables.sh ~/eduardoos.com_20260619/deploy/aws/ && chmod +x ~/eduardoos.com_20260619/deploy/ec2/*.sh ~/eduardoos.com_20260619/deploy/aws/*.sh"

      - name: Upload frontend dist tarball
        if: steps.scope.outputs.skip != '1' && steps.scope.outputs.frontend == '1'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTS \
            frontend-dist.tgz \
            "${EC2_USER}@${EC2_HOST}:/tmp/frontend-dist.tgz"
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "ls -lh /tmp/frontend-dist.tgz"

      - name: Run remote deploy (selective)
        if: steps.scope.outputs.skip != '1'
        timeout-minutes: 40
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_BACKEND: ${{ steps.scope.outputs.backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.frontend }}
          DEPLOY_NGINX: ${{ steps.scope.outputs.nginx }}
        run: |
          ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS \
            "${EC2_USER}@${EC2_HOST}" \
            "echo '==> Waiting for /tmp/eduardoos-ec2-deploy.lock (max 15m)...'; flock -w 900 /tmp/eduardoos-ec2-deploy.lock bash -lc 'cd ~/eduardoos.com_20260619 && git fetch origin master && git reset --hard origin/master && chmod +x deploy/ec2/*.sh deploy/aws/*.sh 2>/dev/null || true && APP_DIR=~/eduardoos.com_20260619 DEPLOY_BACKEND=${DEPLOY_BACKEND} DEPLOY_FRONTEND=${DEPLOY_FRONTEND} DEPLOY_NGINX=${DEPLOY_NGINX} bash deploy/ec2/deploy-remote.sh'"

      - name: Smoke check
        if: steps.scope.outputs.skip != '1'
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          sleep 15
          onbox=$(ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" \
            'api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health || true); \
             echo "api=${api}"')
          echo "On-box smoke: ${onbox}"
          echo "${onbox}" | grep -q 'api=200' || { echo "::error::Production backend :3000 unhealthy"; exit 1; }

          smtp_smoke=$(ssh -n -T -i ~/.ssh/deploy_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" \
            'set -e
             ENV=~/eduardoos.com_20260619/.env
             line=$(grep -E "^SMTP_PASS=" "$ENV" | head -n1 | cut -d= -f2- | tr -d "\r" | sed "s/^\"//; s/\"$//; s/^'\''//; s/'\''$//" | tr -d "[:space:]")
             echo "env_smtp_pass_len=${#line}"
             journal=$(sudo journalctl -u eduardoos -b --no-pager -o cat 2>/dev/null | grep -E "smtp: user=" | tail -n1 || true)
             echo "startup_smtp_line=${journal}"
             ')
          echo "SMTP smoke (no secrets): ${smtp_smoke}"
          echo "${smtp_smoke}" | grep -q 'env_smtp_pass_len=16' || {
            echo "::error::Production .env SMTP_PASS length is not 16 after deploy — secret name must be SMTP_PASS and workflow must rebuild .env"
            exit 1
          }
          echo "${smtp_smoke}" | grep -q 'pass_set=true' || {
            echo "::error::eduardoos.service started without SMTP_PASS (pass_set!=true). Check EnvironmentFile=~/…/.env and restart."
            exit 1
          }
          echo "${smtp_smoke}" | grep -Eq 'pass_norm_len=16|pass_raw_len=16' || {
            echo "::warning::startup smtp line missing pass_*_len=16 — check journalctl -u eduardoos for smtp:"
          }

          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/" || true)
          health=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/health" || true)
          echo "HTTPS status for https://${DOMAIN}/: ${code}"
          echo "HTTPS status for https://${DOMAIN}/health: ${health}"
          if [ "${code}" != "200" ]; then
            echo "::warning::HTTPS home smoke did not return 200 (cert may still be self-signed)"
          fi
          if [ "${health}" != "200" ]; then
            echo "::warning::HTTPS /health smoke did not return 200"
          fi

      - name: Skipped (no production-scoped changes)
        if: steps.scope.outputs.skip == '1'
        run: echo "No backend/frontend/nginx/deploy paths changed — remote deploy skipped."
